# configs/models.yaml — the single model registry (CLAUDE.md §4).
#
# Every script that touches a model takes --model <registry-name> and reads
# this file. No HF (Hugging Face) repo (repository) ids, chat-template kwargs, or stop tokens may be
# hardcoded anywhere else. Adding a model = one entry here + one DECISIONS.md
# line, zero code changes. Artifacts are keyed by registry name:
# runs/<name>/preds_<split>.jsonl, W&B (Weights & Biases) run names, RESULTS.md rows.
#
# Field notes:
#   hf_id / revision      exact repo id + commit pin (verified 2026-08-13 via
#                         the HF API (application programming interface); re-pin deliberately, never implicitly)
#   chat_template_kwargs  passed to tokenizer.apply_chat_template; the §6
#                         prompt text itself is identical for every model
#   stop                  generation stop sequences (template end token; the
#                         one-line output grammar is enforced by parsing, not
#                         by stop strings)
#   max_seq_len           tokenizer/serving ceiling; SFT (supervised fine-tuning) truncation is a
#                         training-config concern (§8 uses 1024)
#   lora_target_modules   default all-linear per §8
#   ref_cost_per_mtok     [input, output] USD per 1M tokens for the §11 cost
#                         metric; null for local models — derived from
#                         measured throughput at a stated GPU-hour rate at
#                         serving time (§10/§11)
#   vllm_extra_args       extra flags for the serve helper

models:
  qwen3.5-4b:                       # primary (§4)
    hf_id: Qwen/Qwen3.5-4B
    revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a   # 2026-03-02 release
    chat_template_kwargs:
      enable_thinking: false        # Qwen3.5 thinks by default; any <think>
                                    # content in a completion is a format
                                    # failure for every model (§4)
    stop: ["<|im_end|>"]
    max_seq_len: 2048
    lora_target_modules: all-linear
    ref_cost_per_mtok: null
    # Qwen3.5 is hybrid: each running sequence holds a linear-attention state
    # (vLLM's Mamba cache); at serve.sh's 0.55 of the card there are 212, and
    # vLLM's default of 256 sequences refused to start (2026-10-13).
    vllm_extra_args: ["--max-num-seqs", "128"]
    # Model-card recommended non-thinking sampling (recorded 2026-08-13):
    # temperature 0.7, top_p 0.8, top_k 20, min_p 0.0, presence_penalty 1.5.
    # Decoding policy is chosen by the baseline/eval scripts, not pinned here.

  qwen3.5-2b:                       # size ablation (owner, 2026-09-09):
    hf_id: Qwen/Qwen3.5-2B          # comparison row, same recipe as the 4B
    revision: 15852e8c16360a2fea060d615a32b45270f8a8fc   # 2026-03-02 release
    chat_template_kwargs:
      enable_thinking: false
    stop: ["<|im_end|>"]
    max_seq_len: 2048
    lora_target_modules: all-linear
    ref_cost_per_mtok: null
    vllm_extra_args: []

